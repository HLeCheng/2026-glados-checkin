name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 09:30（UTC 01:30）
    - cron: '30 1 * * *'

    # 北京时间 21:30（UTC 13:30）
    - cron: '30 13 * * *'

  # 允许手动运行
  workflow_dispatch:

  # main 分支更新时执行一次
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 5
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
